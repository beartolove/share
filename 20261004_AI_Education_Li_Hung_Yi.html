<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>2026 台灣 AI 教育年會 Day 1：李宏毅談 AI 教書與教師角色</title><body><h1>2026 台灣 AI 教育年會 Day 1：李宏毅談 AI 教書與教師角色</h1><h2>重點摘要</h2><h3>一句話總結</h3><p>當 AI 能生成教材與提供個別化回饋，教師的重要性轉向設計學習、判斷品質與陪伴學生思考。</p><h3>核心重點</h3><ul><li>AI 可協助教材與回饋，但不取代教學判斷。</li><li>教師要設定學習目標、提出好問題並理解學生差異。</li><li>應檢驗學生是否真正理解，而非只追求快速答案。</li></ul><h2>影片說明欄</h2><p>已嘗試公開頁說明欄擷取；未取得可解析內容。</p><h2>逐字稿與摘要檔</h2><p><a target="_blank" rel="noopener" href="https://drive.google.com/file/d/1G-EcPCUVKENqBbyctjTMGXfXoH1yWYXT/view">完整逐字稿下載</a></p><p><a target="_blank" rel="noopener" href="https://drive.google.com/file/d/1JwDU2wjxo451164csI1J0VBV71II1CAw/view">重點摘要下載</a></p><h2>來源影片</h2><a target="_blank" rel="noopener" href="https://youtu.be/qLTyaNn5_78?si=RoOd-Tf6GnnqmvlH">https://youtu.be/qLTyaNn5_78?si=RoOd-Tf6GnnqmvlH</a></body></html>
